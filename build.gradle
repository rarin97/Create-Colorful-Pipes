import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath(), '--existing-mod', 'create',
					'--existing-mod' ,'create_connected', '--existing-mod', 'create_dragons_plus', '--existing-mod', 'create_enchantment_industry', '--existing-mod', 'electroenergetics', '--existing-mod', 'vsfluidlink'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

def generatedResources = layout.projectDirectory.dir("src/generated/resources").asFile

tasks.register("conditionCompats") {
	doLast {
		def parser = new JsonSlurper()
		[
				new File(generatedResources, "assets/colorfulpipes/blockstates"),
				new File(generatedResources, "assets/colorfulpipes/models/block"),
				new File(generatedResources, "assets/colorfulpipes/models/item"),
				new File(generatedResources, "data/colorfulpipes/loot_table/blocks"),
				new File(generatedResources, "data/colorfulpipes/recipe/crafting/compats")
		].each { dir ->
			if (!dir.exists())
				return

			dir.eachFileRecurse { file ->
				String modid = null

				switch (true) {
					case file.name.endsWith("_fluid_hatch.json"):
						modid = "create_dragons_plus"
						break

					case file.name.endsWith("_fluid_vessel.json"):
						modid = "create_connected"
						break

					case (file.name.endsWith("_electric_pump.json") || file.name.endsWith("_electric_pump_roll.json")):
						modid = "electroenergetics"
						break

					case (file.name.endsWith("_experience_hatch.json") || file.name.endsWith("_experience_lantern.json") ||
							file.name.endsWith("_printer.json") || file.name.endsWith("_grindstone_drain.json")):
						modid = "create_enchantment_industry"
						break

					default:
						return
				}

				def json = parser.parse(file)

				if (json instanceof Map && json.containsKey("neoforge:conditions"))
					return

				def wrapped = new LinkedHashMap()
				wrapped["neoforge:conditions"] = [[
														  type : "neoforge:mod_loaded",
														  modid: modid
												  ]]
				wrapped.putAll(json)

				file.text = JsonOutput.prettyPrint(JsonOutput.toJson(wrapped))
			}
		}
	}
}

tasks.named("runData") {
	finalizedBy("conditionCompats")
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
	maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
	maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
	maven { url = "https://maven.blamejared.com" }
	maven { url = "https://api.modrinth.com/maven" }
	maven { url = "https://maven.dragons.plus/releases" } // DragonsPlusMinecraft Maven
	maven { url = "https://maven.fallenbreath.me/releases" } // Conditional Mixin

	maven {url = "https://maven.ryanhcode.dev/releases" }
}
dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

	//implementation("plus.dragons.createdragonsplus:create-dragons-plus-${minecraft_version}:${create_dragons_plus_version}")
	implementation("maven.modrinth:create-dragons-plus:${create_dragons_plus_version}")
	implementation "maven.modrinth:create-connected:${create_connected_version}"
	implementation "maven.modrinth:create-enchantment-industry:${create_enchantment_industry_version}"
	implementation "maven.modrinth:create-electro-energetics:${create_electro_energetics_version}"
	//implementation "maven.modrinth:create-aeronautics:${create_aeronautics_version}"
	//implementation "maven.modrinth:sable:${sable_version}"

	implementation "maven.modrinth:jade:${project.jade_version}"
	implementation("mezz.jei:jei-$minecraft_version-neoforge:$jei_version")

	implementation "maven.modrinth:create-Encased:${create_encased_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
							 create_dragons_plus_version_range  : create_dragons_plus_version_range]

    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
		maven {
			url = layout.projectDirectory.dir("repo")
		}
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
